<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar documento</title>
</head>
<body>

    <h1>Sistema de Admisiones</h1>
    <h2>Registrar documento</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ formulario.as_p }}

        <button type="submit">Guardar documento</button>
    </form>

    <br>
    <a href="{% url 'listar_documentos' %}">Volver al listado</a>

</body>
</html>
