
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de carreras</title>
</head>
<body>

    <h1>Sistema de Admisiones</h1>

    {% if es_edicion %}
        <h2>Editar carrera</h2>
    {% else %}
        <h2>Registrar nueva carrera</h2>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ formulario.as_p }}

        {% if es_edicion %}
            <button type="submit">Actualizar carrera</button>
        {% else %}
            <button type="submit">Guardar carrera</button>
        {% endif %}
    </form>

    <br>

    <a href="{% url 'listar_carreras' %}">
        Volver al listado
    </a>

</body>
</html>
