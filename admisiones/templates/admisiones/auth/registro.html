<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de usuario</title>
</head>
<body>
    <h1>Sistema de Admisiones</h1>
    <h2>Registrar usuario</h2>

    <form method="POST">
        {% csrf_token %}
        {{ formulario.as_p }}

        <button type="submit">Registrarse</button>
    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}">Iniciar sesión</a>
    </p>
</body>
</html>
