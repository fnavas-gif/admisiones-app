<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
</head>
<body>
    <h1>Sistema de Admisiones</h1>
    <h2>Iniciar sesión</h2>

    {% if messages %}
        {% for mensaje in messages %}
            <p>{{ mensaje }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ formulario.as_p }}

        <button type="submit">Ingresar</button>
    </form>

    <p>
        ¿No tienes una cuenta?
        <a href="{% url 'registro' %}">Registrarse</a>
    </p>
</body>
</html>
